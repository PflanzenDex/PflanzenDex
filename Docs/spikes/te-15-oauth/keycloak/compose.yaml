# Spike TE-15: Keycloak as OAuth authorization server for MCP (throwaway setup, not for production)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: te15-keycloak
    command: start-dev --features=cimd,resource-indicators --proxy-headers=xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      # For tunnel tests set via environment variable: KC_HOSTNAME=https://<tunnel>
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "18080:8080"
    volumes:
      - kcdata:/opt/keycloak/data

volumes:
  kcdata:
