# Dependabot version updates for container images (owner decisions d-128 and d-129, 2026-11-26, issue 2529).
# Docker only: the Dockerfiles (base images and the BuildKit syntax pin) and the compose files. npm and GitHub Actions
# stay out of scope. Dependabot replaces Renovate (FR-QG-15, US-DEV-03).
# One multi-ecosystem group: one pull request per week for both ecosystems.
# Not covered, updated by hand (Dependabot reads no Makefile or shell script):
#   tools/lint/image-scan.sh (grype), Makefile (test database postgres), app/config/deploy/scripts/deploy.sh (alpine),
#   app/config/deploy/scripts/restore/restore-test.sh (postgres), tools/lint/actionlint.sh (actionlint).
version: 2
multi-ecosystem-groups:
  images:
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    target-branch: dev
    # The squash commit takes the PR title: Conventional Commits type and scope (commitlint) plus a story ID,
    # so that `make merge` finds a story in the title (US-DEV-03).
    commit-message:
      prefix: "chore(deps): US-DEV-03"
updates:
  - package-ecosystem: docker
    directory: /app/config/deploy/docker
    multi-ecosystem-group: images
    patterns:
      - "*"
  - package-ecosystem: docker-compose
    directories:
      - /app/config/dev
      - /app/config/deploy
    multi-ecosystem-group: images
    patterns:
      - "*"
    # PostgreSQL major upgrades only with a migration plan and a restore test (US-DEV-07, NFR-15).
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
