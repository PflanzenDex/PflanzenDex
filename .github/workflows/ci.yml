# CI (E-13, FR-QG-01/02, FR-DEV-09): the jobs call the same `make` targets a developer runs locally.
# Path filter: the app suite only runs when `app/`, the Makefile or the workflows change.
# `ci-status` is the aggregate status and the only required check in the rulesets (ADR 0001).
name: CI

on:
  pull_request:
    branches: [dev, main]
    # `edited`: the squash turns the PR title into the commit message, so a changed title is checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(app/|Makefile$|\.github/|\.nvmrc$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Database tests (TE-02): real PostgreSQL as in production (E-01); same port as `make db-up`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pflanzendex_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secret scan over the full history (QG-S1)
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: make setup
      - run: make ci

  # QG-S2 for dependencies a PR adds or changes: known high-severity vulnerabilities block the merge.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # QG-S2 in full: all dependencies, only for release PRs into `main` (E-13); otherwise nightly (nightly.yml).
  audit:
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: make setup
      - run: make audit

  # QG-C1 for the PR title: the squash into `dev` and the merge into `main` use it as the commit message.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: make setup
      # Pass the title only as an environment variable, never inline it in the command (script injection).
      - env:
          MSG: ${{ github.event.pull_request.title }}
        run: make commitlint

  ci-status:
    needs: [changes, app, pr-title, dependency-review, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.app.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          for r in "$CHANGES" "$APP" "$PR_TITLE" "$DEPENDENCY_REVIEW" "$AUDIT"; do
            case "$r" in
              success | skipped) ;;
              *) echo "failed: $r"; exit 1 ;;
            esac
          done
          echo "ci-status: green"
