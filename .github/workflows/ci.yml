# CI (E-13, FR-QG-01/02, FR-DEV-09): the jobs call the same `make` targets a developer runs locally.
# Path filters: the app suite only runs when `app/`, the Makefile or the workflows change; the docs and spec gates
# (`docs-gates`) run when documentation changes (US-QG-02, #1389).
# `ci-status` is the aggregate status and the only required check in the rulesets (ADR 0001).
name: CI

on:
  pull_request:
    branches: [dev, main]
    # `edited`: the squash turns the PR title into the commit message, so a changed title is checked again.
    # `ready_for_review`: a draft (e.g. from `make claim`, placeholder title) skips the metadata jobs; this run checks them.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # Push runs only on `main` (the release workflow needs them). The PR run already checked what a squash merges into `dev`.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Title/body edits and leaving draft change no code: they get their own group, so they never cancel the run that is
  # testing the same commit; their `reuse` job waits for that run instead (US-QG-02, #404).
  group: ci-${{ github.ref }}${{ contains(fromJSON('["edited","ready_for_review"]'), github.event.action) && '-meta' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      one-screen: ${{ steps.filter.outputs.one-screen }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            { echo "app=true"; echo "one-screen=true"; echo "docs=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          # QG-U8: the one-screen run only when the UI, the e2e package, the demo seed it measures or the gate files change
          # (issues 1137, 1164).
          if git diff --name-only "$base" HEAD | grep -qE '^(app/packages/(web|e2e)/|app/packages/api/perf/(demo-seed|catalog-seed)/|app/config/gates/|Makefile$|\.github/)'; then
            echo "one-screen=true" >> "$GITHUB_OUTPUT"
          else
            echo "one-screen=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(app/|Makefile$|\.github/|\.nvmrc$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          # US-QG-02 (issue 1389): documentation changed, so the docs and spec gates run (job `docs-gates`). Every `.md` file
          # counts, the link check reads all of them; `.agents/` and `.claude/skills/` hold the skill check.
          if git diff --name-only "$base" HEAD | grep -qE '^(docs/|\.agents/|\.claude/skills/|\.markdownlint-cli2\.jsonc$)|\.md$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  # US-QG-02 (#404): a title/body edit or leaving draft starts a run on an unchanged commit. A green `app-*`,
  # `ds-snapshots`, `one-screen`, `a11y-routes` or `lighthouse` job of that head commit is reused (issue 1184: the two gates were skipped
  # on edits without this proof, so an edit turned a red gate green) (waiting while a run of it is still going); a failed, cancelled or
  # missing result, a changed base branch or any API error runs the job in full. Nothing else is ever assumed green.
  reuse:
    if: >-
      github.event_name == 'pull_request'
      && contains(fromJSON('["edited","ready_for_review"]'), github.event.action)
      && !github.event.changes.base
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    outputs:
      app-gates: ${{ steps.reuse.outputs['app-gates'] }}
      app-tests: ${{ steps.reuse.outputs['app-tests'] }}
      app-tests-web: ${{ steps.reuse.outputs['app-tests-web'] }}
      app-coverage: ${{ steps.reuse.outputs['app-coverage'] }}
      app-ui: ${{ steps.reuse.outputs['app-ui'] }}
      ds-snapshots: ${{ steps.reuse.outputs['ds-snapshots'] }}
      one-screen: ${{ steps.reuse.outputs['one-screen'] }}
      a11y-routes: ${{ steps.reuse.outputs['a11y-routes'] }}
      lighthouse: ${{ steps.reuse.outputs['lighthouse'] }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make ci-reuse JOBS="app-gates app-tests app-tests-web app-coverage app-ui ds-snapshots one-screen a11y-routes lighthouse"

  # The app suite (`make ci`) in three parallel parts, each with its own time limit (US-QG-02, #1118): in one job it ran
  # 10 to 15 minutes and was cancelled at its 15-minute limit although every step passed. The parts call the targets
  # `make ci` chains locally, so nothing is dropped. Editing a draft's title or body (Handoff updates) does not rerun
  # them; `ready_for_review` runs everything unless `reuse` found a green result for the same commit. `!cancelled()`
  # because `reuse` is skipped on most events.
  app-gates:
    needs: [changes, reuse]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
      && needs.reuse.outputs.app-gates != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # secret scan over the full history (QG-S1)
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make ci-gates
      # US-QG-08: the five most complex functions in the job summary. Report only: it runs after a failure too, and a
      # failing report never fails the job; the summary then gets one line instead of nothing (P-10).
      - name: Health report
        if: always()
        run: make health-report >> "$GITHUB_STEP_SUMMARY" || echo "Health report unavailable (report only), see the step log." >> "$GITHUB_STEP_SUMMARY"

  app-tests:
    needs: [changes, reuse]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
      && (needs.reuse.outputs.app-tests != 'success' || needs.reuse.outputs.app-coverage != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Database tests (TE-02): real PostgreSQL as in production (E-01); same port as `make db-up`.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pflanzendex_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make ci-tests-base
      # Only what the ratchet (coverage-summary.json) and the CRAP check (coverage-final.json) read in app-coverage.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-base
          path: |
            app/packages/*/coverage/coverage-summary.json
            app/packages/*/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  # The web suite beside app-tests (issue 1125): in one job it ran after api, core and db and made app-tests the slowest
  # job. Reused only together with app-coverage, so the ratchet never runs on half the coverage.
  app-tests-web:
    needs: [changes, reuse]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
      && (needs.reuse.outputs.app-tests-web != 'success' || needs.reuse.outputs.app-coverage != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make ci-tests-web
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          # Same pattern as coverage-base: the wildcard keeps `web/coverage/` in the artifact, so the download lands there.
          path: |
            app/packages/*/coverage/coverage-summary.json
            app/packages/*/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  # Coverage ratchet and CRAP check over all four packages, once both test jobs have succeeded in this run (issue 1125).
  # When they are reused, this job was green on the same commit too and is skipped with them.
  app-coverage:
    needs: [changes, reuse, app-tests, app-tests-web]
    if: >-
      !cancelled() && needs.app-tests.result == 'success' && needs.app-tests-web.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Shallow like app-tests before the split: without origin/dev the CRAP check scores all functions, as before.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: app/packages
          merge-multiple: true
      - run: make ci-coverage

  app-ui:
    needs: [changes, reuse]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
      && needs.reuse.outputs.app-ui != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make browsers # QG-U5: the conformance run drives Chromium over the stories
      - run: make ci-ui
      # QG-U6 report (FR-QG-10): initial JS per chunk and package in the job summary. Report only: runs after a
      # failure too, and a failing report never fails the job (the blocking gate is the budget step inside `make ci-ui`).
      - name: Initial JS bundle report
        if: always()
        run: make bundle-report >> "$GITHUB_STEP_SUMMARY" || echo "bundle report unavailable (report only)"

  # QG-S2 for dependencies a PR adds or changes: known high-severity vulnerabilities block the merge.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # QG-S2 in full: all dependencies, only for release PRs into `main` (E-13); otherwise nightly (nightly.yml).
  audit:
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make audit

  # QG-U1 / FR-QG-09 (issue 1136): Lighthouse on the built web app, median of 3 mobile runs against the limits in
  # `app/config/gates/quality-limits.json`; blocking. Runs on PRs into `dev` and `main` when the app changes (about 2 min,
  # parallel to the other jobs), on a manual dispatch and nightly (nightly.yml).
  lighthouse:
    needs: [changes, reuse]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
      && needs.reuse.outputs.lighthouse != 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make lighthouse
      - if: always()
        run: cat app/packages/web/.lighthouseci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: app/packages/web/.lighthouseci
          if-no-files-found: ignore

  # QG-T3 + QG-U1 (axe blocks on serious/critical): Playwright against the real stack, mobile and desktop. Release PRs into `main` and manual runs only (E-15).
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pflanzendex_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: |
            app/packages/e2e/playwright-report
            app/packages/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # QG-U8 (US-QS-15, DS-58, issue 1137): every view and layer fits the window at 360x640 to 1920x1080 and under the
  # 1920 px width cap. Blocking from the first PR; known failures sit in the baseline (FR-QG-17). Read-only run with
  # several workers. Runs for PRs into `dev` and `main` when the UI, the e2e package or the gate files change, and by hand.
  one-screen:
    needs: [changes, reuse]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && needs.changes.outputs.one-screen == 'true'
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
      && needs.reuse.outputs.one-screen != 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pflanzendex_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make one-screen
      - name: Ratio table per screen and size
        if: always()
        run: make one-screen-report >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: one-screen-report
          path: |
            app/packages/e2e/one-screen-report
            app/packages/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # QG-U7 (FR-QG-24, issue 467): axe (WCAG 2.2 A and AA, serious and critical) and the keyboard walk over every view and
  # layer at 390x844 and 1920x1080. Blocking from the first PR; known failures sit in the baseline (FR-QG-17). Read-only run
  # with several workers. Runs on the same paths as one-screen (its `changes` output), and by hand.
  a11y-routes:
    needs: [changes, reuse]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && needs.changes.outputs.one-screen == 'true'
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
      && needs.reuse.outputs.a11y-routes != 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pflanzendex_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make a11y-routes
      - name: Findings per rule and screen
        if: always()
        run: make a11y-routes-report >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-routes-report
          path: |
            app/packages/e2e/a11y-routes-report
            app/packages/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # QG-C1 for the PR title (the squash into `dev` and the merge into `main` use it as the commit message)
  # and QG-U3 (`feat:`/`fix:` PRs need a German entry in the user changelog or `[skip-changelog]`).
  # Not for drafts: `make claim` opens them with a placeholder title; `ready_for_review` runs this job.
  metadata:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      # Title and body only as environment variables, never inline in the command (script injection).
      - env:
          MSG: ${{ github.event.pull_request.title }}
        run: make commitlint
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: make changelog-check

  # QG-C4: the file layout is checked for every change, also when only `docs/` or the repo root changed
  # (the `app-*` jobs are skipped for those). The check needs no dependencies; the full history gives it `origin/dev`
  # for the "baseline must not grow" comparison (a missing ref fails in CI).
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: make layout

  # US-QG-02 (issue 1389): the docs and spec gates for a change that touches documentation (the `docs` output of
  # `changes`). The `app-*` jobs skip such a pull request, so without this job markdownlint, the link check and the spec
  # checks ran only in pre-push and the nightly. Same targets as the docs part of `make gates` (`make ci-docs`); light:
  # no database, no browser, no build. Not in `reuse` and no draft skip: it runs in full on an edit and on
  # `ready_for_review` too, so `ci-status` never shows green for documentation that was not checked on that commit.
  # `fetch-depth: 0`: check-reference compares its baseline with origin/dev (RF-5), as the `layout` job does.
  docs-gates:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make ci-docs

  # QG-U5 / US-QS-07 (ADR 0010): visual regression of the `components/ui` stories (360 px, light and dark) in the
  # pinned Playwright container, so the pictures equal the baselines in `app/packages/web/.storybook/snapshots` made on a laptop.
  # On failure the diff images are attached. Never updates baselines (`make ds-snapshots` is a local step).
  ds-snapshots:
    needs: [changes, reuse]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
      && !(github.event.action == 'edited' && github.event.pull_request.draft)
      && needs.reuse.outputs['ds-snapshots'] != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: make ds-snapshots-check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ds-snapshots-diff
          path: app/.cache/ds-snapshots-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  ci-status:
    needs:
      [
        changes,
        reuse,
        app-gates,
        app-tests,
        app-tests-web,
        app-coverage,
        app-ui,
        layout,
        docs-gates,
        ds-snapshots,
        metadata,
        dependency-review,
        audit,
        lighthouse,
        e2e,
        one-screen,
        a11y-routes,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          REUSE: ${{ needs.reuse.result }}
          APP_GATES: ${{ needs.app-gates.result }}
          APP_TESTS: ${{ needs.app-tests.result }}
          APP_TESTS_WEB: ${{ needs.app-tests-web.result }}
          APP_COVERAGE: ${{ needs.app-coverage.result }}
          APP_UI: ${{ needs.app-ui.result }}
          LAYOUT: ${{ needs.layout.result }}
          DOCS_GATES: ${{ needs.docs-gates.result }}
          DS_SNAPSHOTS: ${{ needs.ds-snapshots.result }}
          METADATA: ${{ needs.metadata.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          AUDIT: ${{ needs.audit.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
          E2E: ${{ needs.e2e.result }}
          ONE_SCREEN: ${{ needs.one-screen.result }}
          A11Y_ROUTES: ${{ needs.a11y-routes.result }}
        run: |
          for r in "$CHANGES" "$REUSE" "$APP_GATES" "$APP_TESTS" "$APP_TESTS_WEB" "$APP_COVERAGE" "$APP_UI" "$LAYOUT" "$DOCS_GATES" "$DS_SNAPSHOTS" "$METADATA" "$DEPENDENCY_REVIEW" "$AUDIT" "$LIGHTHOUSE" "$E2E" "$ONE_SCREEN" "$A11Y_ROUTES"; do
            case "$r" in
              success | skipped) ;;
              *) echo "failed: $r"; exit 1 ;;
            esac
          done
          echo "ci-status: green"
