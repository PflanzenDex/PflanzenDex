name: Story or enabler
description: Work item from the spec. The spec is authoritative; the issue only points to it.
labels: [story]
body:
  - type: markdown
    attributes:
      value: |
        New features start in `Docs/PRODUCT-SPECS/` (a story with Given/When/Then criteria); the issue comes second.
  - type: input
    id: id
    attributes:
      label: Story ID
      placeholder: US-XXX-nn
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release
      options: [R0 Fundament, R1 Parität, R2 Soziales, R3 Tausch und Erinnerungen, R4 KI-Zugang, R5 Equipment, R6 Sensorik]
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Description and acceptance criteria
      description: copied unchanged from the spec (German); if they differ, the spec wins
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      value: |
        **Blocked by:**
        **Blocks:**
