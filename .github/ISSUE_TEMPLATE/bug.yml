name: Bug
description: Something behaves differently than the spec describes.
projects: ["PflanzenDex/2"] # type, release and epic are set on the board (fields Typ, Release, Epic)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The label `bug` is set by this form. An epic label (`epic:XX`) is required too (FR-DEV-10): without it the issue gets the label `needs-triage` and a comment naming what is missing.
  - type: input
    id: spec
    attributes:
      label: Affected story or requirement
      description: ID from docs/specs/product, e.g. US-PHA-02 or FR-WAC-03
      placeholder: US-…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Given / When / Then
      description: Starting state, action, expected and actual result. This becomes the regression test (P-06).
      value: |
        Given:
        When:
        Then expected:
        Actual:
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The line "Version …" at the bottom of "Was die App kann" (Konto, address /account/functions); it reads "unbekannt" when the build has no version. The public /health shows only the status, /health/details (inside the stack) also the version.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Device, browser, screenshots. No real location data or photos with GPS metadata (P-05).
