# Node from .nvmrc plus the dependencies of `app/` (issue 1123). node_modules is cached under the hash of .nvmrc and
# app/package-lock.json; on a hit `make setup` sees the matching check-deps stamp and skips `npm ci` (35-57 s per job
# before, 3-10 s for the restore, measured in issue 1120). A changed lock file changes the key, so stale modules are
# never restored. PRs read the cache of their base branch, which `deps-cache.yml` fills on `dev`.
name: Set up the app
description: Node from .nvmrc and app dependencies, with the node_modules cache
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: app/package-lock.json
    - uses: actions/cache@v6
      with:
        path: |
          app/node_modules
          app/packages/*/node_modules
          !app/packages/*/node_modules/.cache
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'app/package-lock.json') }}
    - run: make setup
      shell: bash
