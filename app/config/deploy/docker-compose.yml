# Local and staging (E-01: one host, Docker Compose). All values come from the environment, see .env.example.
# Start: docker compose --env-file config/deploy/.env -f config/deploy/docker-compose.yml up -d --build
name: pflanzendex
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  # One-shot: applies pending migrations (forward only, advisory lock) before the api starts (#201, US-DEV-07).
  # A failing migration fails `up`, so deploy.sh rolls back the code and the api never serves a half-migrated schema.
  migrate:
    build:
      context: ../..
      dockerfile: config/deploy/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unbekannt}
        APP_VERSION: ${APP_VERSION:-unbekannt}
    restart: "no"
    working_dir: /srv/app/packages/db
    command: ["npx", "tsx", "src/kernel/migrate-cli.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ../..
      dockerfile: config/deploy/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unbekannt}
        APP_VERSION: ${APP_VERSION:-unbekannt}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: ../..
      dockerfile: config/deploy/web.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-unbekannt}
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS fehlt}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api
      - web
volumes:
  dbdata:
  caddydata:
