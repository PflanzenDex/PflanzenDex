# Local, test and staging (E-01: one host, Docker Compose). All values come from the environment, see .env.example.
# Start: docker compose --env-file config/deploy/.env -f config/deploy/docker-compose.yml up -d --build
# Test environment with a mail catcher: add `-f config/deploy/docker-compose.test.yml` (or set COMPOSE_FILE in .env).
# Memory limits (`deploy.resources.limits`) are starting values for a 3 GB host (assumption, TE-03); measure and adjust.
name: pflanzendex
# Every service keeps at most 3 log files of 10 MB (TE-03, #762; starting values, assumption): a noisy client cannot
# fill the host's disk. The overlay files repeat the same values for their own services.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
services:
  db:
    logging: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing}
    # PostgreSQL 18 keeps its data in <mount>/18/docker; PostgreSQL 16 kept it at the root of the volume. The volume is
    # therefore mounted one level up. Upgrade from 16: docs/guides/operations/postgres-major-upgrade.md.
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
  # One-shot: creates the sign-in service's own role and database in the same server, idempotently (also on an existing
  # volume). The role has no right on the app database, so tenant isolation stays untouched (P-04, TE-03).
  keycloak-db:
    logging: *logging
    image: postgres:18-alpine
    restart: "no"
    entrypoint: ["sh", "/init-db.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB: ${POSTGRES_DB}
      KC_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is missing}
    volumes:
      - ./keycloak/init-db.sh:/init-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
  # One-shot: makes the schema owner of the app database a plain role (no superuser, no BYPASSRLS) and creates the
  # application role, idempotently, also on an existing volume (#907, P-04). A superuser as table owner makes every
  # `security definer` function ignore row-level security. Runs as the cluster user, which nothing else connects as.
  db-roles:
    logging: *logging
    image: postgres:18-alpine
    restart: "no"
    entrypoint: ["sh", "/db-roles/init-db-roles.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB: ${POSTGRES_DB}
      DB_OWNER_USER: ${DB_OWNER_USER:-pflanzendex_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is missing (see .env.example)}
    volumes:
      - ./docker/db-roles:/db-roles:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
  # One-shot: applies pending migrations (forward only, advisory lock) before the api starts (#201, US-DEV-07).
  # A failing migration fails `up`, so deploy.sh rolls back the code and the api never serves a half-migrated schema.
  migrate:
    logging: *logging
    build:
      context: ../..
      dockerfile: config/deploy/docker/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
    restart: "no"
    working_dir: /srv/app/packages/db
    command: ["npx", "tsx", "src/kernel/migrate-cli.ts"]
    environment:
      # The schema owner, never the cluster user (#907). DB_ROLE_CHECK=enforce refuses a superuser or BYPASSRLS role.
      DATABASE_URL: postgres://${DB_OWNER_USER:-pflanzendex_owner}:${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is missing}@db:5432/${POSTGRES_DB}
      DB_ROLE_CHECK: enforce
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m
  # Sign-in service (E-03): production mode, own database in `db`. TLS ends at the proxy in front, so Keycloak speaks
  # plain HTTP inside the network and trusts the forwarded headers (the proxy only forwards them from TRUSTED_PROXIES).
  # The realm is imported on the first start only; later changes to the file do not touch an existing realm.
  keycloak:
    logging: *logging
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is missing}
      KC_HOSTNAME: ${AUTH_URL:?AUTH_URL is missing}
      # The admin console and the master realm are blocked on the public name (proxy.Caddyfile). They get their own
      # address on the host's loopback, reached only through an SSH tunnel (runbook "Admin console over an SSH tunnel").
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:-8180}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is missing}
      # JVM heap: starting values for a 3 GB host (assumption).
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_JAVA_HEAP:--Xms128m -Xmx512m}
      # Placeholders of the realm file (keycloak/pflanzendex-realm.json).
      WEB_BASE_URL: ${APP_URL:?APP_URL is missing}
      # Production: a real SMTP server from .env. Empty means no mail (sign-up confirmation then fails visibly).
      KC_SMTP_HOST: ${SMTP_HOST:-}
      KC_SMTP_PORT: ${SMTP_PORT:-587}
      KC_SMTP_FROM: ${SMTP_FROM:-noreply@pflanzendex.invalid}
      KC_SMTP_AUTH: ${SMTP_AUTH:-false}
      KC_SMTP_USER: ${SMTP_USER:-}
      KC_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KC_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      KC_SMTP_SSL: ${SMTP_SSL:-false}
    # Loopback of the host only, never a public interface: the admin console over an SSH tunnel.
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8180}:8080"
    volumes:
      - ./keycloak/pflanzendex-realm.json:/opt/keycloak/data/import/pflanzendex-realm.json:ro
      - ../dev/keycloak-theme/pflanzendex:/opt/keycloak/themes/pflanzendex:ro
    healthcheck:
      # The image has no curl; the management port 9000 answers /health/ready.
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 900m
  api:
    logging: *logging
    build:
      context: ../..
      dockerfile: config/deploy/docker/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
    restart: unless-stopped
    environment:
      # The schema owner, never the cluster user (#907); it also runs the background jobs, the requests switch to the
      # application role per transaction. DB_ROLE_CHECK=enforce refuses to start with a superuser or BYPASSRLS role.
      DATABASE_URL: postgres://${DB_OWNER_USER:-pflanzendex_owner}:${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is missing}@db:5432/${POSTGRES_DB}
      DB_ROLE_CHECK: enforce
      PORT: "3000"
      # Tokens carry the public issuer; the keys are fetched inside the network (no detour over the public address).
      OIDC_ISSUER: ${AUTH_URL:?AUTH_URL is missing}/realms/pflanzendex
      OIDC_JWKS_URL: http://keycloak:8080/realms/pflanzendex/protocol/openid-connect/certs
      OIDC_AUDIENCE: pflanzendex-api
      WEB_ORIGIN: ${APP_URL:?APP_URL is missing}
      AI_RESOURCE_URL: ${APP_URL}/api/mcp
      # Global feature switches (US-DEV-06): e.g. `social,ai`. Empty: all off in production.
      FEATURES: ${FEATURES:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
  web:
    logging: *logging
    build:
      context: ../..
      dockerfile: config/deploy/docker/web.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
        VITE_OIDC_AUTHORITY: ${AUTH_URL:?AUTH_URL is missing}/realms/pflanzendex
        VITE_OIDC_CLIENT_ID: pflanzendex-web
        VITE_API_URL: ${APP_URL}/api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96m
  # Public entry. CADDY_SCHEME=http:// (TLS ends at a proxy in front) or empty (Caddy gets certificates itself).
  proxy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_SCHEME: ${CADDY_SCHEME:-}
      APP_HOST: ${APP_HOST:?APP_HOST is missing}
      AUTH_HOST: ${AUTH_HOST:?AUTH_HOST is missing}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
      # Allowed in the app's Content-Security-Policy (connect-src, frame-src; proxy.Caddyfile).
      AUTH_URL: ${AUTH_URL:?AUTH_URL is missing}
      # Target of the redirect from the sign-in host's root (proxy.Caddyfile).
      APP_URL: ${APP_URL:?APP_URL is missing}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api
      - web
      - keycloak
    deploy:
      resources:
        limits:
          memory: 64m
volumes:
  dbdata:
  caddydata:
