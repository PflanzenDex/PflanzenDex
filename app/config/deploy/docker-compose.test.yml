# Test environment overlay (TE-03): a mail catcher for the confirmation emails of the sign-in service.
# Not for production: there the realm sends through a real SMTP server (SMTP_* in .env).
# Use: COMPOSE_FILE=docker-compose.yml:docker-compose.test.yml in .env, or a second `-f` option.
services:
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    # The same privilege settings as the services of docker-compose.yml (#761); the image runs as root without `user`.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "65534:65534"
    # The same log limit as the services of docker-compose.yml (TE-03, #762).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    environment:
      # The UI lives under /mail/ on the sign-in hostname (proxy.mail.caddy); nothing is published on the host.
      MP_WEBROOT: /mail
    deploy:
      resources:
        limits:
          memory: 64m
  # The realm sends to the mail catcher (unless SMTP_HOST is set); it needs no login and no TLS.
  keycloak:
    environment:
      KC_SMTP_HOST: ${SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${SMTP_PORT:-1025}
      KC_SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    depends_on:
      - mailpit
  proxy:
    environment:
      # Basic auth of the mail catcher UI (proxy.mail.caddy); a bcrypt hash, see .env.example.
      MAIL_UI_USER: ${MAIL_UI_USER:?MAIL_UI_USER is missing}
      MAIL_UI_HASH: ${MAIL_UI_HASH:?MAIL_UI_HASH is missing}
    volumes:
      - ./proxy.mail.caddy:/etc/caddy/conf.d/mail.caddy:ro
    depends_on:
      - mailpit
