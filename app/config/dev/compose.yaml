# Local auth server (E-03: self-hosted Keycloak) plus a mail catcher for the confirmation email.
# Development only: start-dev with H2. Credentials come from the environment (see `make auth-up`), never from the repo.
# Images are pinned to an exact version and a digest, the same as the deployment (#761); Renovate keeps them current.
name: pflanzendex-auth
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    container_name: pflanzendex-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?password missing, use make auth-up}
      KC_HOSTNAME: http://localhost:18081
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak-theme/pflanzendex:/opt/keycloak/themes/pflanzendex:ro
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: pflanzendex-mailpit
    ports:
      - "127.0.0.1:18025:8025"
