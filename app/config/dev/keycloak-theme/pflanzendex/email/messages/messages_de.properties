verifiableCredentialOfferBody=Dein Administrator hat dich gerade darüber informiert, dass du in deinem PflanzenDéx-Konto den verifizierbaren Nachweis "{3}" für deine digitale Wallet abrufen kannst. Klicke auf den untenstehenden Link, um diesen Vorgang zu starten.\n\n{0}\n\nDieser Link läuft in {4} ab.\n\nSollte der Link bereits abgelaufen sein, kannst du deinen Nachweis "{3}" möglicherweise auf andere Weise abrufen (zum Beispiel über die Verwaltung deines PflanzenDéx-Kontos).
