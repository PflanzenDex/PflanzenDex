# E-mail theme of PflanzenDéx (US-QS-32, F-0376): the mails of the sign-up, the password reset, the required actions and the
# other mails of the realm speak "du" and name the product. The texts are in messages/messages_de.properties; the HTML and
# text templates come from the parent theme (base). The realm selects this theme with "emailTheme" (the dev and deploy
# realm, app/config/*/keycloak/pflanzendex-realm.json; a running realm gets it from the setup step in deploy/keycloak/mcp).
parent=base
locales=de
