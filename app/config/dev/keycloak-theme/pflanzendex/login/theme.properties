# Login theme in PflanzenDex design (#205, US-QS-14, direction "Gewächshaus split", owner decision 2026-10-30).
# Keycloak's v2 theme with our frame (template.ftl), colours (ADR 0017, copied into css/pflanzendex.css) and German
# "du" texts (messages/messages_de.properties). The theme offers German only, so there is no language dropdown.
# The stylesheet link carries a content version (#2161): Keycloak serves a theme file for 30 days under a URL whose
# resources version belongs to the container, so a changed css/pflanzendex.css needs a new ?v= (the first 12 hex digits of
# its sha256). app/tools/keycloak/theme.test.mjs fails until the value matches.
parent=keycloak.v2
locales=de
styles=css/styles.css css/pflanzendex.css?v=66eea95af3d9
