# Local S3-compatible object storage (TE-05): MinIO for development and tests. Development only; any EU S3-compatible
# host replaces it later without code changes (the app reads S3_* variables, see docs/guides/reference/app.md).
# Credentials come from the environment, never from the repo:
#   MINIO_ROOT_PASSWORD=... docker compose -f app/config/dev/storage.compose.yaml up -d
# Then run the API tests with S3_ENDPOINT=http://127.0.0.1:19000 S3_REGION=eu-central-1 S3_BUCKET=pflanzendex-test
# S3_ACCESS_KEY_ID=pflanzendex S3_SECRET_ACCESS_KEY=<the same password>.
name: pflanzendex-storage
services:
  minio:
    # Upstream stopped publishing MinIO images (Docker Hub, quay.io); Chainguard builds the current release from source.
    image: cgr.dev/chainguard/minio:latest
    container_name: pflanzendex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pflanzendex
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD (at least 8 characters)}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
volumes:
  minio-data:
