<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Entdecken Katalog mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif}
button,input{font-family:inherit}
button{cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--soft);color:var(--softtext)}
.ph{display:flex;align-items:center;justify-content:center;border-radius:14px;flex:none}
.p1{background:var(--t1b);color:var(--t1f)}.p2{background:var(--t2b);color:var(--t2f)}.p3{background:var(--t3b);color:var(--t3f)}.p4{background:var(--t4b);color:var(--t4f)}
.h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.5px}
.mut{color:var(--muted)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:20px;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--soft);color:var(--softtext)}
.fc{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13.5px;font-weight:600;flex:none}
.fc.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.sp{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--text)}
.sp b{display:block;font-size:15px;font-weight:600;font-style:italic}.sp small{display:block;font-size:13px;color:var(--muted)}
.nav{display:flex;padding:8px 8px 14px;background:var(--surface);border-top:1px solid var(--line)}
.nav a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;font-weight:600;color:var(--muted)}
.nav a span{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav a.on{color:var(--text)}.nav a.on span{background:var(--soft)}
</style>
</helmet>
<div style="{{vars}};width:360px;height:760px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5a3 3 0 010 6M18 14c2 .6 3 2.6 3 6"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
</defs></svg>
<header style="padding:24px 20px 8px"><div class="mut" style="font-size:13px;font-weight:500">118 Arten</div><h1 class="h1">Entdecken</h1></header>
<div style="padding:4px 16px"><div class="seg" role="group" aria-label="Ansicht"><button aria-pressed="false">Vorschläge</button><button class="on" aria-pressed="true">Katalog</button></div></div>
<div style="padding:10px 16px 4px"><label style="display:flex;align-items:center;gap:8px;min-height:48px;box-sizing:border-box;padding:0 16px;border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--muted)"><svg class="i" style="width:20px;height:20px"><use href="#search"/></svg><input id="q" placeholder="Art, deutscher Name oder Gattung" style="flex:1;border:0;background:transparent;color:var(--text);font-size:15px;outline:none;min-width:0"></label></div>
<div style="display:flex;gap:8px;padding:6px 16px;overflow:hidden"><button class="fc on">Alle</button><button class="fc">Leicht</button><button class="fc">Zone 2</button><button class="fc">Zone 3</button></div>
<div style="flex:1;min-height:0;overflow:hidden;padding:4px 16px 0">
<a href="#" class="sp"><div class="ph p1" style="width:52px;height:52px"><svg class="i" style="width:26px;height:26px"><use href="#leaf"/></svg></div><div style="flex:1"><b>Alocasia zebrina</b><small>Aronstabgewächse</small></div><span class="chip">mittel</span><svg class="i mut"><use href="#chev"/></svg></a>
<a href="#" class="sp"><div class="ph p2" style="width:52px;height:52px"><svg class="i" style="width:26px;height:26px"><use href="#leaf"/></svg></div><div style="flex:1"><b>Philodendron hederaceum</b><small>Aronstabgewächse</small></div><span class="chip">leicht</span><svg class="i mut"><use href="#chev"/></svg></a>
<a href="#" class="sp"><div class="ph p3" style="width:52px;height:52px"><svg class="i" style="width:26px;height:26px"><use href="#leaf"/></svg></div><div style="flex:1"><b>Hoya carnosa</b><small>Hundsgiftgewächse</small></div><span class="chip">leicht</span><svg class="i mut"><use href="#chev"/></svg></a>
<a href="#" class="sp"><div class="ph p4" style="width:52px;height:52px"><svg class="i" style="width:26px;height:26px"><use href="#leaf"/></svg></div><div style="flex:1"><b>Zamioculcas zamiifolia</b><small>Aronstabgewächse</small></div><span class="chip">leicht</span><svg class="i mut"><use href="#chev"/></svg></a>
<a href="#" class="sp"><div class="ph p1" style="width:52px;height:52px"><svg class="i" style="width:26px;height:26px"><use href="#leaf"/></svg></div><div style="flex:1"><b>Epipremnum aureum</b><small>Aronstabgewächse</small></div><span class="chip">unbekannt</span><svg class="i mut"><use href="#chev"/></svg></a>
</div>
<nav class="nav" aria-label="Hauptnavigation">
<a href="#"><span><svg class="i"><use href="#sun"/></svg></span>Heute</a>
<a href="#"><span><svg class="i"><use href="#leaf"/></svg></span>Sammlung</a>
<a href="#" class="on"><span><svg class="i"><use href="#compass"/></svg></span>Entdecken</a>
<a href="#"><span><svg class="i"><use href="#users"/></svg></span>Freunde</a>
<a href="#"><span><svg class="i"><use href="#user"/></svg></span>Konto</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark"]}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'dark') === 'dark';
const P = dark
? {bg:'#0F1612',surface:'#18221C',text:'#E6EFE9',muted:'#A5B6AB',line:'#2B3B31',primary:'#7BD3A0',onprimary:'#0B2316',soft:'#1F3A2B',softtext:'#A9E8C4',shadow:'rgba(0,0,0,0.35)',t1b:'#27432F',t1f:'#7BD3A0',t2b:'#3A3A20',t2f:'#E3D07A',t3b:'#25384A',t3f:'#8EC5F0',t4b:'#3C2B3F',t4f:'#E0A8E8'}
: {bg:'#F2F6F3',surface:'#FFFFFF',text:'#14201A',muted:'#4B5C52',line:'#D3DED6',primary:'#1B6B4A',onprimary:'#FFFFFF',soft:'#D8EEDF',softtext:'#124A32',shadow:'rgba(20,40,28,0.08)',t1b:'#CFE8D6',t1f:'#1B6B4A',t2b:'#EEF0C8',t2f:'#5A5A12',t3b:'#D4E6F4',t3f:'#1F4F78',t4b:'#F0DDF2',t4f:'#6B2C75'};
return { vars: Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';') };
}
}
</script>
</body>
</html>
