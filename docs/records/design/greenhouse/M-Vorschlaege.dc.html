<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Entdecken Vorschläge mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--soft);color:var(--softtext)}
.h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.5px}
.mut{color:var(--muted)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:20px;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--soft);color:var(--softtext)}
.round{width:60px;height:60px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--shadow)}
.nav{display:flex;padding:8px 8px 14px;background:var(--surface);border-top:1px solid var(--line)}
.nav a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;font-weight:600;color:var(--muted)}
.nav a span{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav a.on{color:var(--text)}.nav a.on span{background:var(--soft)}
</style>
</helmet>
<div style="{{vars}};width:360px;height:760px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5a3 3 0 010 6M18 14c2 .6 3 2.6 3 6"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></symbol>
</defs></svg>
<header style="padding:24px 20px 8px">
<div class="mut" style="font-size:13px;font-weight:500">Karte 3 von 12</div>
<h1 class="h1">Entdecken</h1>
</header>
<div style="padding:4px 16px"><div class="seg" role="group" aria-label="Ansicht"><button class="on" aria-pressed="true">Vorschläge</button><button aria-pressed="false">Katalog</button></div></div>
<div style="flex:1;min-height:0;position:relative;padding:14px 24px 0">
<div style="position:absolute;left:36px;right:36px;top:30px;height:430px;border-radius:28px;background:var(--surface);opacity:.6;transform:scale(.94);box-shadow:0 6px 16px var(--shadow)"></div>
<article style="position:relative;height:440px;border-radius:28px;background:var(--surface);box-shadow:0 12px 28px var(--shadow);overflow:hidden;display:flex;flex-direction:column;transform:rotate(-1.5deg)">
<div style="height:220px;background:var(--t1b);color:var(--t1f);display:flex;align-items:center;justify-content:center"><svg class="i" style="width:96px;height:96px;stroke-width:1.1"><use href="#leaf"/></svg></div>
<div style="padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1">
<h2 style="margin:0;font-size:22px;font-weight:700;font-style:italic">Alocasia zebrina</h2>
<div style="display:flex;gap:6px"><span class="chip">Zone 2</span><span class="chip">mittel</span></div>
<p style="margin:0;font-size:14px;line-height:1.45" class="mut">Passt zu deinem Küchenfenster: Zone 2 hat Platz für 2 weitere Pflanzen.</p>
<div class="mut" style="font-size:12px;margin-top:auto">Quelle: GBIF · Bild: Wikipedia (Link)</div>
</div>
</article>
</div>
<div style="display:flex;justify-content:center;gap:28px;padding:14px 0 14px">
<button class="round" style="background:var(--surface);color:var(--text)" aria-label="Nicht interessiert"><svg class="i" style="width:28px;height:28px"><use href="#x"/></svg></button>
<button class="round" style="background:var(--primary);color:var(--onprimary)" aria-label="Auf die Wunschliste"><svg class="i" style="width:28px;height:28px"><use href="#heart"/></svg></button>
</div>
<nav class="nav" aria-label="Hauptnavigation">
<a href="#"><span><svg class="i"><use href="#sun"/></svg></span>Heute</a>
<a href="#"><span><svg class="i"><use href="#leaf"/></svg></span>Sammlung</a>
<a href="#" class="on"><span><svg class="i"><use href="#compass"/></svg></span>Entdecken</a>
<a href="#"><span><svg class="i"><use href="#users"/></svg></span>Freunde</a>
<a href="#"><span><svg class="i"><use href="#user"/></svg></span>Konto</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'light') === 'dark';
const P = dark
? {bg:'#0F1612',surface:'#18221C',text:'#E6EFE9',muted:'#A5B6AB',line:'#2B3B31',primary:'#7BD3A0',onprimary:'#0B2316',soft:'#1F3A2B',softtext:'#A9E8C4',shadow:'rgba(0,0,0,0.35)',t1b:'#27432F',t1f:'#7BD3A0'}
: {bg:'#F2F6F3',surface:'#FFFFFF',text:'#14201A',muted:'#4B5C52',line:'#D3DED6',primary:'#1B6B4A',onprimary:'#FFFFFF',soft:'#D8EEDF',softtext:'#124A32',shadow:'rgba(20,40,28,0.08)',t1b:'#CFE8D6',t1f:'#1B6B4A'};
return { vars: Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';') };
}
}
</script>
</body>
</html>
