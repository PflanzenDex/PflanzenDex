<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Konto mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--surface);border-radius:22px;box-shadow:0 1px 2px var(--shadow),0 6px 16px var(--shadow)}
.btn2{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--line);background:transparent;color:var(--text);font-weight:600;font-size:15px;width:100%}
.h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.5px}
.mut{color:var(--muted)}
.sec{font-size:13px;font-weight:600;color:var(--muted);padding:10px 4px 0}
.lr{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--text);font-size:15px;font-weight:500}
.lr:first-child{border-top:0}
.lr small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.av{width:56px;height:56px;border-radius:50%;background:var(--t1b);color:var(--t1f);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.nav{display:flex;padding:8px 8px 14px;background:var(--surface);border-top:1px solid var(--line)}
.nav a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;font-weight:600;color:var(--muted)}
.nav a span{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav a.on{color:var(--text)}.nav a.on span{background:var(--soft)}
</style>
</helmet>
<div style="{{vars}};width:360px;height:760px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5a3 3 0 010 6M18 14c2 .6 3 2.6 3 6"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
</defs></svg>
<header style="padding:24px 20px 8px"><h1 class="h1">Konto</h1></header>
<div style="flex:1;min-height:0;overflow:hidden;padding:4px 16px 0;display:flex;flex-direction:column;gap:6px">
<div class="card" style="padding:14px;display:flex;align-items:center;gap:14px"><div class="av">K</div><div style="flex:1"><div style="font-size:17px;font-weight:700">Konrad</div><div class="mut" style="font-size:13.5px">angemeldet über den Anmeldedienst</div></div></div>
<div class="sec">Einstellungen</div>
<div class="card"><a href="#" class="lr"><span style="flex:1">Erinnerungen<small>Uhrzeit, Ruhezeiten, Pause</small></span><svg class="i mut"><use href="#chev"/></svg></a><a href="#" class="lr"><span style="flex:1">Zeitzone<small>Europa/Berlin</small></span><svg class="i mut"><use href="#chev"/></svg></a><a href="#" class="lr"><span style="flex:1">Teilen und Datenschutz<small>Was Freunde sehen</small></span><svg class="i mut"><use href="#chev"/></svg></a><a href="#" class="lr"><span style="flex:1">Einladungen<small>2 offen</small></span><svg class="i mut"><use href="#chev"/></svg></a></div>
<div class="sec">Mein Zuhause</div>
<div class="card"><a href="#" class="lr"><span style="flex:1">Standorte und Licht<small>5 Standorte, 1 ohne Zone</small></span><svg class="i mut"><use href="#chev"/></svg></a></div>
<div style="padding-top:10px"><button class="btn2">Abmelden</button></div>
</div>
<nav class="nav" aria-label="Hauptnavigation">
<a href="#"><span><svg class="i"><use href="#sun"/></svg></span>Heute</a>
<a href="#"><span><svg class="i"><use href="#leaf"/></svg></span>Sammlung</a>
<a href="#"><span><svg class="i"><use href="#compass"/></svg></span>Entdecken</a>
<a href="#"><span><svg class="i"><use href="#users"/></svg></span>Freunde</a>
<a href="#" class="on"><span><svg class="i"><use href="#user"/></svg></span>Konto</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'light') === 'dark';
const P = dark
? {bg:'#0F1612',surface:'#18221C',text:'#E6EFE9',muted:'#A5B6AB',line:'#2B3B31',soft:'#1F3A2B',shadow:'rgba(0,0,0,0.35)',t1b:'#27432F',t1f:'#7BD3A0'}
: {bg:'#F2F6F3',surface:'#FFFFFF',text:'#14201A',muted:'#4B5C52',line:'#D3DED6',soft:'#D8EEDF',shadow:'rgba(20,40,28,0.08)',t1b:'#CFE8D6',t1f:'#1B6B4A'};
return { vars: Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';') };
}
}
</script>
</body>
</html>
