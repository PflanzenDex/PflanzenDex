<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>C Heute mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Lexend',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="{{vars}};width:360px;height:760px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM8 17h11"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
<symbol id="drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></symbol>
<symbol id="ruler" viewBox="0 0 24 24"><path d="M3 15L15 3l6 6L9 21zM8 10l2 2M11 7l2 2M5 13l2 2"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
</defs></svg>
<header style="padding:22px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between">
<div><div style="font-size:12px;color:var(--muted);font-weight:500">Mi., 7. Oktober</div><h1 style="margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-0.6px">Heute</h1></div>
</header>
<a href="#" style="margin:4px 16px 0;padding:14px;border-radius:18px;background:var(--hero);color:var(--herotext);text-decoration:none;display:flex;align-items:center;gap:14px;min-height:44px">
<div style="width:56px;height:56px;border-radius:50%;flex:none;background:conic-gradient(var(--heroring) 0 36%,var(--herotrack) 0);display:flex;align-items:center;justify-content:center"><div style="width:44px;height:44px;border-radius:50%;background:var(--hero);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">42</div></div>
<div style="flex:1"><div style="font-size:16px;font-weight:700">Pokédex</div><div style="font-size:13px;opacity:0.9">42 von 118 Arten gefangen</div></div>
<div style="font-size:13px;font-weight:700;border-radius:12px;padding:6px 12px;background:var(--heroring);color:var(--onhero)">Öffnen</div>
</a>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px 0">
<div style="font-size:13px;font-weight:600;color:var(--muted);padding:0 2px">Jetzt dran</div>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 4px 0 var(--line)">
<div style="width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:{{t.bg}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="{{t.icon}}"/></svg></div>
<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;line-height:1.25">{{t.name}}</div><div style="font-size:12.5px;color:var(--muted);line-height:1.35">{{t.meta}}</div></div>
<button aria-label="{{t.label}}" style="min-width:64px;min-height:48px;border-radius:14px;border:0;background:var(--primary);color:var(--onprimary);font-size:14px;font-weight:700;box-shadow:0 3px 0 var(--primarydark)">{{t.short}}</button>
</div>
</sc-for>
<div style="display:flex;align-items:center;gap:12px;background:var(--warnbg);color:var(--warntext);border-radius:18px;padding:12px 14px;margin-top:2px">
<div style="flex:1;font-size:13.5px;line-height:1.4"><b>Ficus lyrata:</b> Lichtzone unbekannt. Lege sie fest.</div>
<button style="min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--warntext);background:transparent;color:var(--warntext);font-weight:700;font-size:13.5px">Zone wählen</button>
</div>
</div>
<nav aria-label="Hauptnavigation" style="display:flex;padding:8px 8px 14px;background:var(--surface);border-top:2px solid var(--line)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:11.5px;font-weight:600;color:{{n.color}}">
<span style="width:48px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:{{n.pill}};color:{{n.pillfg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><use href="{{n.icon}}"/></svg></span>{{n.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark"]}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'dark') === 'dark';
const P = dark
? {bg:'#12102A',surface:'#1D1A40',text:'#EFEBFF',muted:'#B3ACE0',line:'#38336E',primary:'#FFC247',primarydark:'#B57F0B',onprimary:'#2A1D00',soft:'#2F2A66',softtext:'#D9D2FF',warnbg:'#4A3A0C',warntext:'#FFD36B',hero:'#2F2A66',herotext:'#EFEBFF',heroring:'#FFC247',herotrack:'#4A4490',onhero:'#2A1D00'}
: {bg:'#F1EEFC',surface:'#FFFFFF',text:'#1A1636',muted:'#504A78',line:'#D2CBF0',primary:'#5A32D4',primarydark:'#3A1E94',onprimary:'#FFFFFF',soft:'#E4DCFF',softtext:'#3A1D9E',warnbg:'#FFE9A8',warntext:'#5C4000',hero:'#5A32D4',herotext:'#FFFFFF',heroring:'#FFC247',herotrack:'#8F70E8',onhero:'#2A1D00'};
const vars = Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';');
const a = dark ? ['#2F2A66','#FFC247'] : ['#E4DCFF','#5A32D4'];
const b = dark ? ['#1F4A44','#6EE0CC'] : ['#CFF2EA','#0F6B5B'];
const c = dark ? ['#4A2A44','#FF9FD0'] : ['#FBDDEC','#9B1F63'];
const tasks = [
{name:'Monstera deliciosa „Frida“',meta:'Gießen · Zone 3 · vor 8 Tagen',bg:b[0],fg:b[1],icon:'#drop',label:'Gießen erledigt',short:'Gießen'},
{name:'Pilea, Steckling',meta:'Wurzeln prüfen · Zone 1 · Tag 12',bg:a[0],fg:a[1],icon:'#eye',label:'Wurzeln geprüft',short:'Prüfen'},
{name:'Sansevieria „Sol“',meta:'Messen · letzte Messung vor 21 Tagen',bg:c[0],fg:c[1],icon:'#ruler',label:'Messung starten',short:'Messen'}
];
const items = [['Heute','#sun'],['Sammlung','#leaf'],['Pokédex','#book'],['Entdecken','#compass'],['Mehr','#more']];
const nav = items.map((x,i) => ({label:x[0],icon:x[1],color:i===0?'var(--text)':'var(--muted)',pill:i===0?'var(--primary)':'transparent',pillfg:i===0?'var(--onprimary)':'inherit'}));
return { vars, tasks, nav };
}
}
</script>
</body>
</html>
