<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Heute mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="{{vars}};width:360px;height:760px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM8 17h11"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
<symbol id="drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></symbol>
<symbol id="ruler" viewBox="0 0 24 24"><path d="M3 15L15 3l6 6L9 21zM8 10l2 2M11 7l2 2M5 13l2 2"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
</defs></svg>
<div style="padding:24px 20px 8px;display:flex;flex-direction:column;gap:2px">
<div style="font-size:13px;color:var(--muted);font-weight:500">Mittwoch, 7. Oktober</div>
<h1 style="margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-0.5px">Heute</h1>
<div style="font-size:14px;color:var(--muted);margin-top:4px">3 Aufgaben, 1 Hinweis</div>
</div>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:8px 16px 0">
<div style="font-size:13px;font-weight:600;color:var(--muted);padding:6px 4px 0">Jetzt dran</div>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:22px;padding:10px 10px 10px 10px;box-shadow:0 1px 2px var(--shadow),0 6px 16px var(--shadow)">
<div style="width:60px;height:60px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;background:{{t.bg}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#leaf"/></svg></div>
<div style="flex:1;min-width:0">
<div style="font-size:16px;font-weight:600;line-height:1.25">{{t.name}}</div>
<div style="font-size:13px;color:var(--muted);line-height:1.35">{{t.meta}}</div>
</div>
<button aria-label="{{t.label}}" style="width:48px;height:48px;border-radius:50%;border:0;flex:none;background:var(--primary);color:var(--onprimary);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="{{t.icon}}"/></svg></button>
</div>
</sc-for>
<div style="display:flex;align-items:center;gap:12px;background:var(--warnbg);color:var(--warntext);border-radius:22px;padding:12px 14px;margin-top:4px">
<div style="flex:1;font-size:14px;line-height:1.4"><b>Ficus lyrata</b> hat noch keine Lichtzone: unbekannt. Lege sie fest, dann zeigen wir den Pflegeplan.</div>
<button style="min-height:44px;padding:0 14px;border-radius:14px;border:2px solid var(--warntext);background:transparent;color:var(--warntext);font-weight:600;font-size:14px">Zone wählen</button>
</div>
<div style="display:flex;align-items:center;gap:12px;background:var(--soft);color:var(--softtext);border-radius:22px;padding:12px 14px">
<div style="flex:1;font-size:14px;line-height:1.4"><b>Mara</b> hat eine <i>Hoya kerrii</i> gefangen.</div>
<button style="min-height:44px;padding:0 14px;border-radius:14px;border:0;background:var(--softtext);color:var(--soft);font-weight:600;font-size:14px">Ansehen</button>
</div>
</div>
<nav aria-label="Hauptnavigation" style="display:flex;padding:8px 8px 14px;background:var(--surface);border-top:1px solid var(--line)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;font-weight:600;color:{{n.color}}">
<span style="width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:{{n.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="{{n.icon}}"/></svg></span>{{n.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'light') === 'dark';
const P = dark
? {bg:'#0F1612',surface:'#18221C',text:'#E6EFE9',muted:'#A5B6AB',line:'#2B3B31',primary:'#7BD3A0',onprimary:'#0B2316',soft:'#1F3A2B',softtext:'#A9E8C4',warnbg:'#3A2F10',warntext:'#F2C766',shadow:'rgba(0,0,0,0.35)'}
: {bg:'#F2F6F3',surface:'#FFFFFF',text:'#14201A',muted:'#4B5C52',line:'#D3DED6',primary:'#1B6B4A',onprimary:'#FFFFFF',soft:'#D8EEDF',softtext:'#124A32',warnbg:'#FFF1CF',warntext:'#6B4700',shadow:'rgba(20,40,28,0.08)'};
const vars = Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';');
const tone = dark ? ['#27432F','#7BD3A0'] : ['#CFE8D6','#1B6B4A'];
const tone2 = dark ? ['#3A3A20','#E3D07A'] : ['#EEF0C8','#5A5A12'];
const tone3 = dark ? ['#25384A','#8EC5F0'] : ['#D4E6F4','#1F4F78'];
const tasks = [
{name:'Monstera deliciosa „Frida“',meta:'Gießen · Zone 3 · zuletzt vor 8 Tagen',bg:tone[0],fg:tone[1],icon:'#drop',label:'Gießen erledigt'},
{name:'Pilea, Steckling',meta:'Wurzeln prüfen · Zone 1 · seit 12 Tagen',bg:tone2[0],fg:tone2[1],icon:'#eye',label:'Wurzeln geprüft'},
{name:'Sansevieria „Sol“',meta:'Messen · letzte Messung vor 21 Tagen',bg:tone3[0],fg:tone3[1],icon:'#ruler',label:'Messung starten'}
];
const items = [['Heute','#sun'],['Sammlung','#leaf'],['Pokédex','#book'],['Entdecken','#compass'],['Mehr','#more']];
const nav = items.map((x,i) => ({label:x[0],icon:x[1],color:i===0?'var(--text)':'var(--muted)',pill:i===0?'var(--soft)':'transparent'}));
return { vars, tasks, nav };
}
}
</script>
</body>
</html>
