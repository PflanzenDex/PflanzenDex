<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B Sammlung mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif}
button,input{font-family:inherit}
</style>
</helmet>
<div style="{{vars}};width:360px;height:760px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM8 17h11"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>
<header style="padding:20px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between">
<div><div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:0.04em">24 PFLANZEN</div>
<h1 style="margin:2px 0 0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-0.3px">Sammlung</h1></div>
<button aria-label="Pflanze hinzufügen" style="width:44px;height:44px;border-radius:6px;border:0;background:var(--primary);color:var(--onprimary);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#plus"/></svg></button>
</header>
<div style="padding:0 16px 10px;display:flex;flex-direction:column;gap:10px">
<label style="display:flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#search"/></svg><input id="q" placeholder="Name oder Art suchen" style="flex:1;border:0;background:transparent;color:var(--text);font-size:15px;outline:none;min-width:0"></label>
<div style="display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden">
<sc-for list="{{seg}}" as="s" hint-placeholder-count="4">
<button style="flex:1;min-height:44px;border:0;border-left:1px solid var(--line);background:{{s.bg}};color:{{s.fg}};font-size:13px;font-weight:600">{{s.label}}</button>
</sc-for>
</div>
</div>
<div style="flex:1;min-height:0;overflow:hidden">
<sc-for list="{{plants}}" as="p" hint-placeholder-count="7">
<a href="#" style="display:flex;align-items:center;gap:12px;min-height:64px;box-sizing:border-box;padding:8px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--text)">
<div style="width:48px;height:48px;border-radius:6px;background:{{p.bg}};flex:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{p.fg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#leaf"/></svg></div>
<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">{{p.name}}</div><div style="font-size:13px;color:var(--muted);font-style:italic">{{p.species}}</div></div>
<div style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.4"><div style="color:{{p.sc}};font-weight:500">{{p.status}}</div><div style="color:var(--muted)">{{p.zone}}</div></div>
</a>
</sc-for>
</div>
<nav aria-label="Hauptnavigation" style="display:flex;padding:0 0 12px;background:var(--surface);border-top:1px solid var(--line)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11.5px;font-weight:600;color:{{n.color}};border-top:3px solid {{n.bar}};margin-top:-1px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="{{n.icon}}"/></svg>{{n.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark"]}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'dark') === 'dark';
const P = dark
? {bg:'#0E0F12',surface:'#16181D',text:'#ECEDEF',muted:'#A0A4AD',line:'#2C2F37',primary:'#9DB0FF',onprimary:'#0B1235',soft:'#1F2748',softtext:'#BCC9FF',warnbg:'#382A10',warntext:'#F0C070',warnline:'#5A4519'}
: {bg:'#F6F6F4',surface:'#FFFFFF',text:'#121212',muted:'#54565C',line:'#D0D1CC',primary:'#2443C9',onprimary:'#FFFFFF',soft:'#E3E8FB',softtext:'#1B3294',warnbg:'#FFE9C7',warntext:'#6A3E00',warnline:'#E8C98F'};
const vars = Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';');
const a = dark ? ['#1F2748','#9DB0FF'] : ['#E3E8FB','#2443C9'];
const b = dark ? ['#2A2D33','#C9CCD3'] : ['#E8E8E4','#3A3C42'];
const mk = (name,species,status,zone,warn,i) => ({name,species,status,zone,bg:i%2?b[0]:a[0],fg:i%2?b[1]:a[1],sc:warn?P.warntext:'var(--text)'});
const plants = [
mk('Frida','Monstera deliciosa','Gießen heute','Zone 3',true,0),
mk('Pilea','Pilea peperomioides','Steckling · T12','Zone 1',false,1),
mk('Lyra','Ficus lyrata','unbekannt','Zone unbekannt',true,2),
mk('Sol','Sansevieria trifasciata','Messen fällig','Zone 2',true,3),
mk('Herz','Hoya kerrii','ok','Zone 3',false,4),
mk('Orbi','Calathea orbifolia','Umtopfen bald','Zone 2',true,5),
mk('Aloe','Aloe vera','ok','Zone 4',false,6)
];
const seg = ['Alle','Zone 1','Zone 2','Zone 3'].map((l,i) => ({label:l,bg:i===0?P.soft:'transparent',fg:i===0?P.softtext:P.text}));
const items = [['Heute','#sun'],['Sammlung','#leaf'],['Pokédex','#book'],['Entdecken','#compass'],['Mehr','#more']];
const nav = items.map((x,i) => ({label:x[0],icon:x[1],color:i===1?'var(--primary)':'var(--muted)',bar:i===1?'var(--primary)':'transparent'}));
return { vars, plants, seg, nav };
}
}
</script>
</body>
</html>
