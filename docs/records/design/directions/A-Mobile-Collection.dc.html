<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Sammlung mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="{{vars}};width:360px;height:760px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden;position:relative">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM8 17h11"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>
<div style="padding:24px 20px 8px;display:flex;align-items:flex-end;justify-content:space-between">
<div><div style="font-size:13px;color:var(--muted);font-weight:500">24 Pflanzen</div>
<h1 style="margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-0.5px">Sammlung</h1></div>
</div>
<div style="display:flex;gap:8px;padding:8px 16px;overflow:hidden">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button style="min-height:44px;padding:0 16px;border-radius:22px;border:1px solid {{c.line}};background:{{c.bg}};color:{{c.fg}};font-size:14px;font-weight:600;flex:none">{{c.label}}</button>
</sc-for>
</div>
<div style="flex:1;min-height:0;overflow:hidden;padding:8px 16px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start">
<sc-for list="{{plants}}" as="p" hint-placeholder-count="6">
<div style="background:var(--surface);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px var(--shadow),0 6px 16px var(--shadow)">
<div style="height:104px;border-radius:16px;background:{{p.bg}};display:flex;align-items:center;justify-content:center"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="{{p.fg}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><use href="#leaf"/></svg></div>
<div style="padding:0 4px 4px;display:flex;flex-direction:column;gap:2px">
<div style="font-size:15px;font-weight:600;line-height:1.25">{{p.name}}</div>
<div style="font-size:12.5px;color:var(--muted);font-style:italic">{{p.species}}</div>
<div style="margin-top:6px;align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:{{p.chipbg}};color:{{p.chipfg}}">{{p.status}}</div>
</div>
</div>
</sc-for>
</div>
<button style="position:absolute;right:16px;bottom:88px;min-height:52px;padding:0 20px 0 16px;border-radius:26px;border:0;background:var(--primary);color:var(--onprimary);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px var(--shadow)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#plus"/></svg>Pflanze</button>
<nav aria-label="Hauptnavigation" style="display:flex;padding:8px 8px 14px;background:var(--surface);border-top:1px solid var(--line)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;font-weight:600;color:{{n.color}}">
<span style="width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:{{n.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="{{n.icon}}"/></svg></span>{{n.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark"]}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'dark') === 'dark';
const P = dark
? {bg:'#0F1612',surface:'#18221C',text:'#E6EFE9',muted:'#A5B6AB',line:'#2B3B31',primary:'#7BD3A0',onprimary:'#0B2316',soft:'#1F3A2B',softtext:'#A9E8C4',warnbg:'#3A2F10',warntext:'#F2C766',shadow:'rgba(0,0,0,0.35)'}
: {bg:'#F2F6F3',surface:'#FFFFFF',text:'#14201A',muted:'#4B5C52',line:'#D3DED6',primary:'#1B6B4A',onprimary:'#FFFFFF',soft:'#D8EEDF',softtext:'#124A32',warnbg:'#FFF1CF',warntext:'#6B4700',shadow:'rgba(20,40,28,0.08)'};
const vars = Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';');
const tones = dark ? [['#27432F','#7BD3A0'],['#3A3A20','#E3D07A'],['#25384A','#8EC5F0'],['#3C2B3F','#E0A8E8']] : [['#CFE8D6','#1B6B4A'],['#EEF0C8','#5A5A12'],['#D4E6F4','#1F4F78'],['#F0DDF2','#6B2C75']];
const mk = (name,species,status,warn,i) => ({name,species,status,bg:tones[i%4][0],fg:tones[i%4][1],chipbg:warn?P.warnbg:P.soft,chipfg:warn?P.warntext:P.softtext});
const plants = [
mk('Frida','Monstera deliciosa','Gießen fällig',true,0),
mk('Pilea','Pilea peperomioides','Steckling',false,1),
mk('Lyra','Ficus lyrata','Zone unbekannt',true,2),
mk('Sol','Sansevieria trifasciata','Alles ok',false,3),
mk('Herz','Hoya kerrii','Alles ok',false,0),
mk('Orbi','Calathea orbifolia','Umtopfen bald',true,1)
];
const chips = ['Alle','Zone 1','Zone 2','Zone 3'].map((l,i) => ({label:l,bg:i===0?P.primary:'transparent',fg:i===0?P.onprimary:P.text,line:i===0?P.primary:P.line}));
const items = [['Heute','#sun'],['Sammlung','#leaf'],['Pokédex','#book'],['Entdecken','#compass'],['Mehr','#more']];
const nav = items.map((x,i) => ({label:x[0],icon:x[1],color:i===1?'var(--text)':'var(--muted)',pill:i===1?'var(--soft)':'transparent'}));
return { vars, plants, chips, nav };
}
}
</script>
</body>
</html>
