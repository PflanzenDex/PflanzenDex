<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Sammlung Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="{{vars}};width:1280px;height:800px;box-sizing:border-box;display:flex;background:var(--bg);color:var(--text);overflow:hidden">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM8 17h11"/></symbol>
<symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="ruler" viewBox="0 0 24 24"><path d="M3 15L15 3l6 6L9 21zM8 10l2 2M11 7l2 2M5 13l2 2"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5a3 3 0 010 6M18 14c2 .6 3 2.6 3 6"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></symbol>
<symbol id="drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></symbol>
</defs></svg>
<aside style="width:248px;flex:none;box-sizing:border-box;padding:24px 16px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px">
<div style="font-size:20px;font-weight:700;letter-spacing:-0.3px;padding:0 12px 20px;display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:10px;background:var(--primary);color:var(--onprimary);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#leaf"/></svg></span>PflanzenDex</div>
<nav aria-label="Hauptnavigation" style="display:flex;flex-direction:column;gap:4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
<a href="#" style="min-height:44px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:14px;text-decoration:none;font-size:15px;font-weight:600;background:{{n.bg}};color:{{n.color}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="{{n.icon}}"/></svg>{{n.label}}</a>
</sc-for>
</nav>
</aside>
<main style="flex:1;min-width:0;padding:32px 40px 0;display:flex;flex-direction:column;gap:20px">
<header style="display:flex;align-items:flex-end;justify-content:space-between">
<div><div style="font-size:14px;color:var(--muted);font-weight:500">24 Pflanzen</div>
<h1 style="margin:0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-0.8px">Sammlung</h1></div>
<button style="min-height:48px;padding:0 22px;border-radius:24px;border:0;background:var(--primary);color:var(--onprimary);font-size:15px;font-weight:700">Pflanze hinzufügen</button>
</header>
<div style="display:flex;gap:8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button style="min-height:44px;padding:0 18px;border-radius:22px;border:1px solid {{c.line}};background:{{c.bg}};color:{{c.fg}};font-size:14px;font-weight:600">{{c.label}}</button>
</sc-for>
</div>
<div style="flex:1;min-height:0;display:flex;gap:24px">
<div style="flex:1;min-width:0;overflow:hidden;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-content:start">
<sc-for list="{{plants}}" as="p" hint-placeholder-count="6">
<div style="background:var(--surface);border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px var(--shadow),0 8px 20px var(--shadow);outline:{{p.ring}}">
<div style="height:150px;border-radius:16px;background:{{p.bg}};display:flex;align-items:center;justify-content:center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="{{p.fg}}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><use href="#leaf"/></svg></div>
<div style="padding:0 6px 6px;display:flex;flex-direction:column;gap:2px">
<div style="font-size:16px;font-weight:600">{{p.name}}</div>
<div style="font-size:13px;color:var(--muted);font-style:italic">{{p.species}}</div>
<div style="margin-top:8px;align-self:flex-start;font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:13px;background:{{p.chipbg}};color:{{p.chipfg}}">{{p.status}}</div>
</div>
</div>
</sc-for>
</div>
<aside style="width:340px;flex:none;box-sizing:border-box;background:var(--surface);border-radius:28px 28px 0 0;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px var(--shadow),0 8px 20px var(--shadow)">
<div style="height:170px;border-radius:20px;background:{{hero.bg}};display:flex;align-items:center;justify-content:center"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="{{hero.fg}}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><use href="#leaf"/></svg></div>
<div><h2 style="margin:0;font-size:22px;font-weight:700">Frida</h2><div style="font-size:14px;color:var(--muted);font-style:italic">Monstera deliciosa · Zone 3</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="background:var(--bg);border-radius:16px;padding:12px"><div style="font-size:12.5px;color:var(--muted)">Nächstes Gießen</div><div style="font-size:16px;font-weight:700;margin-top:2px">heute</div></div>
<div style="background:var(--bg);border-radius:16px;padding:12px"><div style="font-size:12.5px;color:var(--muted)">Blätter seit 30 Tagen</div><div style="font-size:16px;font-weight:700;margin-top:2px">+2 (eigener Verlauf)</div></div>
</div>
<div style="display:flex;gap:10px;margin-top:auto;padding-bottom:20px">
<button style="flex:1;min-height:48px;border-radius:24px;border:0;background:var(--primary);color:var(--onprimary);font-weight:700;font-size:15px">Gießen</button>
<button style="flex:1;min-height:48px;border-radius:24px;border:2px solid var(--primary);background:transparent;color:var(--text);font-weight:700;font-size:15px">Messen</button>
</div>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark"]}}'>
class Component extends DCLogic {
renderVals() {
const dark = (this.props.theme ?? 'dark') === 'dark';
const P = dark
? {bg:'#0F1612',surface:'#18221C',text:'#E6EFE9',muted:'#A5B6AB',line:'#2B3B31',primary:'#7BD3A0',onprimary:'#0B2316',soft:'#1F3A2B',softtext:'#A9E8C4',warnbg:'#3A2F10',warntext:'#F2C766',shadow:'rgba(0,0,0,0.35)'}
: {bg:'#F2F6F3',surface:'#FFFFFF',text:'#14201A',muted:'#4B5C52',line:'#D3DED6',primary:'#1B6B4A',onprimary:'#FFFFFF',soft:'#D8EEDF',softtext:'#124A32',warnbg:'#FFF1CF',warntext:'#6B4700',shadow:'rgba(20,40,28,0.08)'};
const vars = Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';');
const tones = dark ? [['#27432F','#7BD3A0'],['#3A3A20','#E3D07A'],['#25384A','#8EC5F0'],['#3C2B3F','#E0A8E8']] : [['#CFE8D6','#1B6B4A'],['#EEF0C8','#5A5A12'],['#D4E6F4','#1F4F78'],['#F0DDF2','#6B2C75']];
const mk = (name,species,status,warn,i) => ({name,species,status,bg:tones[i%4][0],fg:tones[i%4][1],chipbg:warn?P.warnbg:P.soft,chipfg:warn?P.warntext:P.softtext,ring:i===0?'3px solid '+P.primary:'none'});
const plants = [
mk('Frida','Monstera deliciosa','Gießen fällig',true,0),
mk('Pilea','Pilea peperomioides','Steckling',false,1),
mk('Lyra','Ficus lyrata','Zone unbekannt',true,2),
mk('Sol','Sansevieria trifasciata','Alles ok',false,3),
mk('Herz','Hoya kerrii','Alles ok',false,0),
mk('Orbi','Calathea orbifolia','Umtopfen bald',true,1)
];
const chips = ['Alle','Zone 1','Zone 2','Zone 3','Zone 4'].map((l,i) => ({label:l,bg:i===0?P.primary:'transparent',fg:i===0?P.onprimary:P.text,line:i===0?P.primary:P.line}));
const items = [['Heute','#sun'],['Sammlung','#leaf'],['Pokédex','#book'],['Entdecken','#compass'],['Wunschliste','#heart'],['Messen','#ruler'],['Freunde','#users'],['Einstellungen','#gear']];
const nav = items.map((x,i) => ({label:x[0],icon:x[1],bg:i===1?P.soft:'transparent',color:i===1?P.softtext:P.muted}));
return { vars, plants, chips, nav, hero:{bg:tones[0][0],fg:tones[0][1]} };
}
}
</script>
</body>
</html>
